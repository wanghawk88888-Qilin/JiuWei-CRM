worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # --- HTTPS server ---
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificate (self-signed for IP-based access)
        ssl_certificate     /etc/nginx/certs/jiuwei-crm.crt;
        ssl_certificate_key /etc/nginx/certs/jiuwei-crm.key;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- Frontend ---
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_set_header X-Forwarded-Host    $host;

            # WebSocket support (Next.js dev mode / HMR)
            proxy_set_header Upgrade             $http_upgrade;
            proxy_set_header Connection          "upgrade";

            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # --- Backend API ---
        location /api {
            # Strip /api prefix before forwarding to backend
            # e.g. /api/v1/leads → /v1/leads on backend
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_set_header X-Forwarded-Host    $host;

            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;

            # Rate limiting for API
            limit_req zone=api_limit burst=20 nodelay;
        }

        # --- Health check ---
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
